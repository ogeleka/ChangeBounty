# ChangeBounty production stack (app only). Nginx and Let's Encrypt run on the host; see docs/DEPLOYMENT.md.
#
#   docker compose build && docker compose up -d
#
# Secrets and settings come from a root-only file OUTSIDE this repository (default below).
name: changebounty

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: changebounty:latest
    container_name: changebounty-app
    restart: unless-stopped
    init: true
    env_file:
      - ${CHANGEBOUNTY_ENV_FILE:-/opt/changebounty/changebounty.env}
    environment:
      NODE_ENV: production
      PORT: "7860"
      DATA_DIR: /data
      TRUST_PROXY: "1"
    # Reachable only from this machine. Nginx is the only public entry point.
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - changebounty-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 256
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:7860/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  changebounty-data:
    name: changebounty-data
