# Install as /etc/nginx/sites-available/changebounty.conf and symlink into sites-enabled.
# Start with this plain-HTTP server block: `certbot --nginx` adds the HTTPS block, the certificate
# paths and the HTTP -> HTTPS redirect, and installs automatic renewal.

upstream changebounty_app {
    server 127.0.0.1:7860;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name changebounty.ogsnap.online;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn cb_conn 40;

    # Only used when the DNS record is proxied through Cloudflare (see docs/DEPLOYMENT.md).
    include /etc/nginx/changebounty-realip*.conf;

    access_log /var/log/nginx/changebounty.access.log;
    error_log  /var/log/nginx/changebounty.error.log warn;

    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Never serve dotfiles or version-control paths, whatever the app does.
    location ~ /\.(?!well-known) {
        return 404;
    }

    location = /api/demo/publish {
        limit_req zone=cb_publish burst=3 nodelay;
        include snippets/changebounty-proxy.conf;
        proxy_pass http://changebounty_app;
    }

    location /api/ {
        limit_req zone=cb_api burst=30 nodelay;
        include snippets/changebounty-proxy.conf;
        proxy_pass http://changebounty_app;
    }

    location / {
        include snippets/changebounty-proxy.conf;
        proxy_pass http://changebounty_app;
    }
}
