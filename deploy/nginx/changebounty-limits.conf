# Install as /etc/nginx/conf.d/changebounty-limits.conf (http context).
limit_req_zone $binary_remote_addr zone=cb_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cb_publish:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=cb_conn:10m;
limit_req_status 429;
limit_conn_status 429;
